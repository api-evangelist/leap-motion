apis:
- aid: leap-motion:leapc-tracking-api
  name: LeapC Tracking API
  description: 'LeapC is the native C API for Ultraleap / Leap Motion hand tracking.
    A client opens a LEAP_CONNECTION to the locally running Ultraleap Hand Tracking
    Service and drives a message pump with LeapPollConnection(), receiving tracking
    events (LEAP_TRACKING_EVENT with LEAP_HAND / LEAP_PALM / LEAP_DIGIT / LEAP_BONE),
    device events, image frames, policy and configuration responses. It is the layer
    the Unity, Unreal, OpenXR and Python bindings are built on. There is no hosted
    HTTP base URL — the transport is local IPC to the tracking service.'
  humanURL: https://docs.ultraleap.com/api-reference/tracking-api/index.html
  tags:
  - Hand Tracking
  - Native API
  - C
