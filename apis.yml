aid: leap-motion
name: Leap Motion
description: 'Leap Motion is the hand-tracking company behind the Leap Motion Controller.
  It merged with Ultrahaptics in 2019 to form Ultraleap, and the Leap Motion brand
  now continues as Ultraleap''s hardware line (Leap Motion Controller 2) and as the
  "Leap" naming across the tracking SDK. The developer surface is not a hosted web
  API: it is LeapC, a native C API that connects a local client to the Ultraleap Hand
  Tracking Service and delivers tracked hands, digits, bones, images and device events
  as polled messages, plus first-party plugins for Unity, Unreal, OpenXR and Python.
  The original leapmotion.com and developer.leapmotion.com domains no longer resolve;
  docs.ultraleap.com and github.com/ultraleap are the live developer surfaces.'
