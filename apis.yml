- aid: leap-motion:tracking-websocket
  name: Ultraleap Tracking WebSocket
  description: 'An open-source WebSocket server from Ultraleap that restores the LeapJS-compatible
    websocket surface removed when Leap Motion Orion V4 was replaced by Ultraleap Gemini
    V5. It streams tracking data over the legacy LeapJS "v6" JSON protocol so browser
    applications can consume hand tracking. It runs locally alongside the tracking
    service; the endpoint is a loopback WebSocket, not a hosted API.'
  humanURL: https://github.com/ultraleap/UltraleapTrackingWebSocket
