notes: >-
  The Leap Motion developer surface is a locally-installed native SDK/service, so
  "versioning" is software/service release versioning of the Ultraleap Hand
  Tracking Software, not a hosted API version path. The major generational shift
  was Leap Motion Orion V4 to Ultraleap Gemini V5, which removed the legacy LeapJS
  WebSocket surface (later partially restored by the open-source
  UltraleapTrackingWebSocket). The Leap Motion Controller 2 hardware continues
  under the Ultraleap brand.
